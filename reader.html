<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
  <title>漫畫閱讀器</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @media (max-width: 700px) {
      .image-stage {
        display: block !important;
        width: 100vw !important;
        max-width: 100vw !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
      }

      #comicImage {
        display: block !important;
        width: 100vw !important;
        max-width: none !important;
        height: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
      }

      body.immersive-mode .reader-header,
      body.immersive-mode .reader-footer {
        display: none !important;
      }

      body.immersive-mode .reader-main {
        height: 100dvh !important;
        padding: 0 !important;
      }

      body.immersive-mode .image-stage {
        height: 100dvh !important;
      }
    }
  </style>
</head>

<body class="reader-page">
  <header class="reader-header">
    <div class="reader-left-actions">
      <a class="control-link" href="index.html">目錄</a>
      <button id="firstPageButton" class="control-button" type="button">第一頁</button>
    </div>

    <div class="reader-title">
      <strong id="chapterTitle">讀取中</strong>
      <span id="pageCounter">第 1／1 頁</span>
    </div>

    <div class="reader-right-actions">
      <select id="pageSelectTop" class="page-select" aria-label="選擇頁數"></select>
      <button id="fullscreenButton" class="control-button" type="button">全螢幕</button>
    </div>
  </header>

  <main class="reader-main">
    <div class="image-stage" id="imageStage">
      <img id="comicImage" alt="漫畫頁面">
      <div id="loadingText" class="loading-text">圖片讀取中……</div>
    </div>
  </main>

  <footer class="reader-footer">
    <div class="footer-row footer-row-pages">
      <button id="nextPageButton" class="page-nav-button primary-next" type="button">下一頁</button>
      <select id="pageSelectBottom" class="page-select" aria-label="選擇頁數"></select>
      <button id="previousPageButton" class="page-nav-button" type="button">上一頁</button>
    </div>

    <div class="footer-row footer-row-chapters">
      <button id="previousChapterButton" type="button">上一話</button>
      <select id="chapterSelect" aria-label="選擇話數"></select>
      <button id="nextChapterButton" type="button">下一話</button>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>

  <script>
    window.addEventListener("load", () => {
      const oldButton = document.getElementById("fullscreenButton");
      if (!oldButton) return;

      const newButton = oldButton.cloneNode(true);
      oldButton.replaceWith(newButton);

      newButton.addEventListener("click", async () => {
        if (document.fullscreenElement) {
          try {
            await document.exitFullscreen();
          } catch (error) {
            console.warn(error);
          }
          document.body.classList.remove("immersive-mode");
          newButton.textContent = "全螢幕";
          return;
        }

        try {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
            newButton.textContent = "退出全螢幕";
            return;
          }
        } catch (error) {
          console.warn(error);
        }

        document.body.classList.toggle("immersive-mode");
        newButton.textContent =
          document.body.classList.contains("immersive-mode")
            ? "退出全螢幕"
            : "全螢幕";
      });

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
          newButton.textContent = "全螢幕";
        }
      });
    });
  </script>
</body>
</html>
