<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>噩盡島</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg: #0c0c0c;
      --panel: #181818;
      --panel-hover: #222;
      --line: #353535;
      --muted: #b8b8b8;
      --text: #ffffff;
      --button: #efefef;
      --button-text: #111111;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body { overflow-y: auto; }

    .site-header {
      padding: 64px 24px 40px;
      text-align: center;
      background: linear-gradient(180deg, #262626 0%, #111 100%);
      border-bottom: 1px solid var(--line);
    }

    .site-header h1 {
      margin: 0 0 12px;
      font-size: clamp(36px, 7vw, 60px);
      line-height: 1.1;
    }

    .site-header p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .chapter-list-wrap {
      width: min(1100px, calc(100% - 32px));
      margin: 32px auto 80px;
    }

    .chapter-list-wrap h2 {
      margin: 0 0 18px;
      font-size: 26px;
    }

    .chapter-list {
      display: grid;
      gap: 16px;
    }

    .chapter-card {
      display: grid;
      grid-template-columns: 220px 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--text);
    }

    .chapter-card:hover { background: var(--panel-hover); }

    .cover-box {
      width: 220px;
      aspect-ratio: 5 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: #101010;
      border: 1px solid #2b2b2b;
    }

    .cover-box img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .chapter-meta { min-width: 0; }

    .chapter-number {
      color: #d7d7d7;
      font-size: 14px;
    }

    .chapter-title {
      margin: 6px 0 8px;
      font-size: 24px;
      line-height: 1.25;
    }

    .chapter-sub {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .progress-text {
      margin-top: 6px;
      color: #d8d8d8;
      font-size: 14px;
    }

    .chapter-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 130px;
    }

    .read-button,
    .restart-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 12px 16px;
      text-decoration: none;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .read-button {
      background: var(--button);
      color: var(--button-text);
    }

    .restart-button {
      background: #2b2b2b;
      color: #fff;
      border: 1px solid #444;
    }

    .empty-message,
    .error-message {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      color: var(--muted);
    }

    /* 手機版維持橫條，不再放大成整張卡片 */
    @media (max-width: 860px) {
      .site-header {
        padding: 38px 16px 26px;
      }

      .site-header h1 {
        font-size: 38px;
      }

      .chapter-list-wrap {
        width: calc(100% - 20px);
        margin: 22px auto 60px;
      }

      .chapter-list-wrap h2 {
        font-size: 24px;
        margin-bottom: 14px;
      }

      .chapter-list {
        gap: 10px;
      }

      .chapter-card {
        grid-template-columns: 122px minmax(0, 1fr) auto;
        gap: 12px;
        padding: 12px;
        border-radius: 14px;
      }

      .cover-box {
        width: 122px;
        aspect-ratio: 5 / 3;
        border-radius: 10px;
      }

      .chapter-number {
        font-size: 12px;
      }

      .chapter-title {
        margin: 3px 0 5px;
        font-size: 17px;
      }

      .chapter-sub {
        font-size: 13px;
      }

      .progress-text {
        margin-top: 3px;
        font-size: 12px;
      }

      .chapter-actions {
        min-width: 74px;
        gap: 7px;
      }

      .read-button,
      .restart-button {
        padding: 9px 10px;
        font-size: 13px;
      }

      .restart-button {
        display: none;
      }
    }

    @media (max-width: 430px) {
      .chapter-card {
        grid-template-columns: 110px minmax(0, 1fr) 68px;
        gap: 10px;
        padding: 10px;
      }

      .cover-box {
        width: 110px;
      }

      .chapter-title {
        font-size: 16px;
      }

      .progress-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .read-button {
        white-space: normal;
        line-height: 1.25;
        padding: 8px 7px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <h1 id="siteTitle">噩盡島</h1>
    <p id="siteDescription">請選擇話數開始閱讀。</p>
  </header>

  <main class="chapter-list-wrap">
    <section>
      <h2>話數列表</h2>
      <div id="chapterList" class="chapter-list">
        <div class="empty-message">話數載入中……</div>
      </div>
    </section>
  </main>

  <script src="data.js?v=20260715-mobile-row-fix"></script>
  <script>
    window.addEventListener("load", () => {
      const chapterList = document.getElementById("chapterList");
      const siteTitle = document.getElementById("siteTitle");
      const siteDescription = document.getElementById("siteDescription");

      if (typeof comicData === "undefined" || !Array.isArray(comicData.chapters)) {
        chapterList.innerHTML =
          '<div class="error-message">data.js 載入失敗，請確認檔案仍在 GitHub 最外層。</div>';
        return;
      }

      siteTitle.textContent = comicData.siteTitle || "噩盡島";
      siteDescription.textContent = comicData.description || "請選擇話數開始閱讀。";
      document.title = comicData.siteTitle || "噩盡島";
      chapterList.innerHTML = "";

      comicData.chapters.forEach((chapter, index) => {
        const pages = Array.isArray(chapter.pages) ? chapter.pages : [];
        const pageCount = pages.length;
        const coverPath = chapter.cover || (pageCount > 0 ? pages[0] : "");

        const progressKey = `comic-progress-${index}`;
        const savedPage = Number(localStorage.getItem(progressKey) || 0);
        const currentPage =
          Number.isInteger(savedPage) && savedPage >= 0 && savedPage < pageCount
            ? savedPage
            : 0;

        const card = document.createElement("article");
        card.className = "chapter-card";

        card.innerHTML = `
          <div class="cover-box">
            ${coverPath
              ? `<img src="${coverPath}?v=20260715-mobile-row-fix"
                      alt="第 ${chapter.number} 話封面"
                      loading="lazy"
                      onerror="this.onerror=null;this.src='${pages[0] || ""}?v=20260715-mobile-row-fix';">`
              : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#888;">無封面</div>`}
          </div>

          <div class="chapter-meta">
            <div class="chapter-number">第 ${chapter.number} 話</div>
            <div class="chapter-title">${chapter.title || ""}</div>
            <div class="chapter-sub">${pageCount} 頁</div>
            <div class="progress-text">進度：第 ${Math.min(currentPage + 1, Math.max(pageCount, 1))}／${pageCount} 頁</div>
          </div>

          <div class="chapter-actions">
            <a class="read-button"
               href="reader.html?chapter=${index}&page=${Math.min(currentPage + 1, Math.max(pageCount, 1))}">
              ${currentPage > 0 ? "繼續閱讀" : "閱讀"}
            </a>
            <a class="restart-button"
               href="reader.html?chapter=${index}&page=1">
              從第一頁開始
            </a>
          </div>
        `;

        chapterList.appendChild(card);
      });
    });
  </script>
</body>
</html>
