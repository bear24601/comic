<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>噩盡島</title>

  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #0c0c0c;
      --panel: #181818;
      --panel-hover: #222;
      --line: #353535;
      --muted: #b8b8b8;
      --text: #ffffff;
      --button: #efefef;
      --button-text: #111111;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body { overflow-y: auto; }

    .site-header {
      padding: 64px 24px 40px;
      text-align: center;
      background: linear-gradient(180deg, #262626 0%, #111 100%);
      border-bottom: 1px solid var(--line);
    }

    .site-header h1 {
      margin: 0 0 12px;
      font-size: clamp(36px, 7vw, 60px);
      line-height: 1.1;
    }

    .site-header p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .chapter-list-wrap {
      width: min(1100px, calc(100% - 32px));
      margin: 32px auto 80px;
    }

    .chapter-list-wrap h2 {
      margin: 0 0 18px;
      font-size: 26px;
    }

    .chapter-list {
      display: grid;
      gap: 16px;
    }

    .chapter-card {
      display: grid;
      grid-template-columns: 220px 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--text);
      text-decoration: none;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .chapter-card:hover {
      transform: translateY(-2px);
      background: var(--panel-hover);
    }

    .cover-box {
      width: 220px;
      aspect-ratio: 5 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: #101010;
      border: 1px solid #2b2b2b;
    }

    .cover-box img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .chapter-meta { min-width: 0; }

    .chapter-number {
      color: #d7d7d7;
      font-size: 14px;
    }

    .chapter-title {
      margin: 6px 0 8px;
      font-size: 24px;
      line-height: 1.25;
    }

    .chapter-sub {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .progress-text {
      margin-top: 6px;
      color: #d8d8d8;
      font-size: 14px;
    }

    .chapter-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
      min-width: 130px;
    }

    .read-button,
    .restart-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 12px 16px;
      text-decoration: none;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .read-button {
      background: var(--button);
      color: var(--button-text);
    }

    .restart-button {
      background: #2b2b2b;
      color: #fff;
      border: 1px solid #444;
    }

    .empty-message,
    .error-message {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      color: var(--muted);
    }

    @media (max-width: 860px) {
      .chapter-card { grid-template-columns: 1fr; }
      .cover-box { width: 100%; }
      .chapter-actions { min-width: 0; width: 100%; }
    }

    @media (max-width: 700px) {
      .site-header {
        padding: 46px 18px 30px;
      }
      .site-header h1 { font-size: 40px; }
      .chapter-list-wrap {
        width: calc(100% - 24px);
        margin-top: 24px;
      }
      .chapter-list-wrap h2 { font-size: 23px; }
      .chapter-card { padding: 14px; }
      .chapter-title { font-size: 20px; }
      .chapter-sub, .progress-text { font-size: 14px; }
      .read-button, .restart-button { padding: 11px 14px; }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <h1 id="siteTitle">噩盡島</h1>
    <p id="siteDescription">請選擇話數開始閱讀。</p>
  </header>

  <main class="chapter-list-wrap">
    <section>
      <h2>話數列表</h2>
      <div id="chapterList" class="chapter-list">
        <div class="empty-message">話數載入中……</div>
      </div>
    </section>
  </main>

  <script src="data.js?v=coverlist1"></script>
  <script>
    window.addEventListener("load", () => {
      const chapterList = document.getElementById("chapterList");
      const siteTitle = document.getElementById("siteTitle");
      const siteDescription = document.getElementById("siteDescription");

      if (typeof comicData === "undefined" || !Array.isArray(comicData.chapters)) {
        chapterList.innerHTML =
          '<div class="error-message">data.js 載入失敗，請確認檔案仍在 GitHub 最外層。</div>';
        return;
      }

      siteTitle.textContent = comicData.siteTitle || "噩盡島";
      siteDescription.textContent = comicData.description || "請選擇話數開始閱讀。";
      document.title = comicData.siteTitle || "噩盡島";

      chapterList.innerHTML = "";

      if (comicData.chapters.length === 0) {
        chapterList.innerHTML =
          '<div class="empty-message">目前還沒有話數。</div>';
        return;
      }

      comicData.chapters.forEach((chapter, index) => {
        const pages = Array.isArray(chapter.pages) ? chapter.pages : [];
        const pageCount = pages.length;
        const fallbackCover = pageCount > 0 ? pages[0] : "";
        const coverPath = chapter.cover || fallbackCover;

        const progressKey = `comic-progress-${index}`;
        const savedPage = Number(localStorage.getItem(progressKey) || 0);
        const currentPage =
          Number.isInteger(savedPage) && savedPage >= 0 && savedPage < pageCount
            ? savedPage
            : 0;

        const readLabel =
          currentPage > 0 ? `繼續閱讀（第 ${currentPage + 1} 頁）` : "開始閱讀";

        const card = document.createElement("article");
        card.className = "chapter-card";

        const safeTitle = chapter.title || "";
        const safeNumber = chapter.number ?? index + 1;
        const safeDate = chapter.date ? `｜${chapter.date}` : "";
        const safeSummary = chapter.summary ? `<div>${chapter.summary}</div>` : "";
        const safeProgress = pageCount > 0
          ? `<div class="progress-text">已記錄進度：第 ${currentPage + 1}／${pageCount} 頁</div>`
          : `<div class="progress-text">尚未加入頁面</div>`;

        card.innerHTML = `
          <div class="cover-box">
            ${coverPath
              ? `<img src="${coverPath}" alt="第 ${safeNumber} 話封面" loading="lazy">`
              : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#888;">無封面</div>`}
          </div>

          <div class="chapter-meta">
            <div class="chapter-number">第 ${safeNumber} 話</div>
            <div class="chapter-title">${safeTitle}</div>
            <div class="chapter-sub">${pageCount} 頁 ${safeDate}</div>
            ${safeSummary}
            ${safeProgress}
          </div>

          <div class="chapter-actions">
            <a class="read-button" href="reader.html?chapter=${index}&page=${Math.min(currentPage + 1, Math.max(pageCount, 1))}">
              ${readLabel}
            </a>
            <a class="restart-button" href="reader.html?chapter=${index}&page=1">
              從第一頁開始
            </a>
          </div>
        `;

        chapterList.appendChild(card);
      });
    });
  </script>
</body>
</html>
