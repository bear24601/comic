<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>噩盡島</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --panel: #17181b;
      --panel2: #1f2024;
      --line: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: #d0d0d0;
      --soft: #a7a7a7;
      --button: #f4f4f4;
      --buttonText: #111111;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    .hero {
      padding: 46px 20px 30px;
      text-align: center;
      background: linear-gradient(180deg, #202126 0%, #111216 100%);
      border-bottom: 1px solid var(--line);
    }

    .hero h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 14px;
      font-size: clamp(44px, 6vw, 72px);
      line-height: 1.05;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 3px 12px rgba(0,0,0,.85), 0 0 28px rgba(0,0,0,.55);
    }
    .site-banner-wrap {
      width: 100%;
      padding: 18px 14px;
      background: #090909;
      border-bottom: 1px solid var(--line);
    }

    .site-banner {
      width: min(100%, 1200px);
      height: auto;
      aspect-ratio: 3 / 1;
      margin: 0 auto;
      display: block;
      object-fit: contain;
      object-position: center;
      border-radius: 10px;
    }

    .wrap {
      width: min(1140px, calc(100% - 28px));
      margin: 30px auto 70px;
    }

    .section-title {
      margin: 0 0 18px;
      font-size: clamp(28px, 3vw, 46px);
      font-weight: 900;
      letter-spacing: .5px;
    }

    .list {
      display: grid;
      gap: 16px;
    }

    .card {
      display: grid;
      grid-template-columns: 220px 1fr auto;
      align-items: center;
      gap: 20px;
      padding: 18px;
      background: linear-gradient(180deg, #17181b 0%, #131417 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset;
    }

    .cover {
      width: 220px;
      aspect-ratio: 5 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #0f1012;
      border: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    .cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .meta {
      min-width: 0;
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      margin-bottom: 6px;
      min-width: 0;
    }

    .chapter-no {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
    }

    .badge-new {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff477e 0%, #ff9a3c 50%, #ffe066 100%);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0,0,0,.35);
      box-shadow: 0 0 16px rgba(255,125,60,.45), 0 0 28px rgba(255,71,126,.25);
      animation: newPulse 1.6s infinite ease-in-out;
      overflow: hidden;
    }

    .badge-new::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.15) 35%, rgba(255,255,255,.85) 50%, rgba(255,255,255,.15) 65%, transparent 100%);
      transform: translateX(-130%);
      animation: newSweep 2.2s infinite linear;
      pointer-events: none;
    }

    @keyframes newPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(255,125,60,.38), 0 0 24px rgba(255,71,126,.18); }
      50% { transform: scale(1.06); box-shadow: 0 0 18px rgba(255,180,80,.55), 0 0 32px rgba(255,71,126,.35); }
    }

    @keyframes newSweep {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(130%); }
    }

    .title {
      margin: 0 0 10px;
      font-size: 20px;
      line-height: 1.25;
      word-break: break-word;
      font-weight: 700;
    }

    .stats {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 16px;
      font-weight: 500;
    }

    .stat-value {
      display: inline-flex;
      align-items: center;
      line-height: 1;
    }

    .progress-top {
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 162px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 12px 22px;
      border-radius: 999px;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .5px;
      transition: transform .15s ease, filter .15s ease, background .15s ease;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.03); }

    .btn-main {
      background: var(--button);
      color: var(--buttonText);
    }

    .btn-sub {
      background: #26272c;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.09);
    }

    .empty, .error {
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .wrap {
        width: calc(100% - 18px);
        margin-top: 20px;
      }

      .section-title { margin-bottom: 14px; }

      .card {
        grid-template-columns: 108px minmax(0, 1fr) 82px;
        gap: 10px;
        padding: 11px;
        border-radius: 18px;
      }

      .cover {
        width: 108px;
        border-radius: 11px;
      }

      .meta {
        min-width: 0;
      }

      .progress-top {
        margin-bottom: 5px;
      }

      .stats {
        gap: 6px;
        font-size: 12px;
        white-space: nowrap;
      }

      .topline {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: nowrap;
        width: 100%;
        margin-bottom: 3px;
      }

      .chapter-no {
        flex: 0 0 auto;
        font-size: 15px;
        white-space: nowrap;
      }

      .badge-new {
        flex: 0 0 auto;
        min-width: 38px;
        height: 19px;
        padding: 0 5px;
        font-size: 9px;
        letter-spacing: .3px;
      }

      .title {
        margin: 0;
        font-size: 15px;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .actions {
        min-width: 0;
        width: 82px;
        gap: 7px;
      }

      .btn {
        min-height: 38px;
        padding: 7px 5px;
        font-size: 12px;
        white-space: nowrap;
        line-height: 1.1;
      }
    }

    @media (max-width: 480px) {
      .site-banner-wrap { padding: 10px 0; }

      .site-banner {
        width: 100%;
        border-radius: 0;
      }

      .hero { padding: 30px 16px 24px; }
      .hero h1 { font-size: 38px; }

      .card {
        grid-template-columns: 94px minmax(0, 1fr) 76px;
        gap: 8px;
        padding: 10px;
      }

      .cover { width: 94px; }
      .chapter-no { font-size: 14px; }
      .title { font-size: 14px; }
      .stats { font-size: 11px; }
      .actions { width: 76px; }
      .btn { min-height: 36px; font-size: 11px; padding: 6px 4px; }

      .badge-new {
        min-width: 35px;
        height: 18px;
        padding: 0 5px;
        font-size: 8px;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1 id="siteTitle">噩盡島</h1>
  </header>

  <div class="site-banner-wrap">
    <img id="siteBanner" class="site-banner" src="images/site-banner.jpg" alt="噩盡島首頁主視覺">
  </div>

  <main class="wrap">
    <h2 class="section-title">話數列表</h2>
    <div id="chapterList" class="list">
      <div class="empty">話數載入中……</div>
    </div>
  </main>

  <script>
    function loadLatestComicData() {
      const script = document.createElement('script');
      script.src = `data.js?v=${Date.now()}`;
      script.onload = renderHome;
      script.onerror = () => {
        const chapterList = document.getElementById('chapterList');
        chapterList.innerHTML = '<div class="error">data.js 載入失敗，請確認 GitHub Actions 已完成更新。</div>';
      };
      document.head.appendChild(script);
    }

    function renderHome() {
      const chapterList = document.getElementById('chapterList');
      const siteTitle = document.getElementById('siteTitle');
      const siteBanner = document.getElementById('siteBanner');

      if (typeof comicData === 'undefined' || !Array.isArray(comicData.chapters)) {
        chapterList.innerHTML = '<div class="error">data.js 載入失敗，請確認 data.js 在 GitHub 最外層，且內容正確。</div>';
        return;
      }

      siteTitle.textContent = comicData.siteTitle || '噩盡島';
      document.title = comicData.siteTitle || '噩盡島';
      chapterList.innerHTML = '';

      const latestChapterNumber = comicData.chapters.reduce((max, ch) => {
        const n = Number(ch.number) || 0;
        return n > max ? n : max;
      }, 0);

      // 看完第29話最後一頁後，首頁主視覺自動切換。
      const chapter29Index = comicData.chapters.findIndex(ch => Number(ch.number) === 29);
      if (chapter29Index >= 0) {
        const chapter29 = comicData.chapters[chapter29Index];
        const chapter29Pages = Array.isArray(chapter29.pages) ? chapter29.pages : [];
        const saved29 = Number(localStorage.getItem(`comic-progress-${chapter29Index}`) || 0);
        const finished29 = chapter29Pages.length > 0 && saved29 >= chapter29Pages.length - 1;

        if (finished29) {
          siteBanner.src = `images/site-banner-after29.png?v=${Date.now()}`;
        } else {
          siteBanner.src = 'images/site-banner.jpg';
        }
      }

      comicData.chapters
        .map((chapter, index) => ({ chapter, index }))
        .sort((a, b) => Number(b.chapter.number) - Number(a.chapter.number))
        .forEach(({ chapter, index }) => {
        const pages = Array.isArray(chapter.pages) ? chapter.pages : [];
        const pageCount = pages.length;
        const progressKey = `comic-progress-${index}`;
        const savedPage = Number(localStorage.getItem(progressKey) || 0);
        const currentPage = Number.isInteger(savedPage) && savedPage >= 0 && savedPage < pageCount ? savedPage : 0;
        const displayPage = Math.min(currentPage + 1, Math.max(pageCount, 1));
        const coverPath = chapter.cover || (pageCount > 0 ? pages[0] : '');
        const isNew = Number(chapter.number) === latestChapterNumber;

        const coverHTML = coverPath
          ? `<img src="${coverPath}?v=20260720-latest-new-auto" alt="第 ${chapter.number} 話封面" loading="lazy" onerror="this.onerror=null;this.src='${pages[0] || ''}?v=20260720-latest-new-auto';">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#888;">無封面</div>`;

        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="cover">${coverHTML}</div>
          <div class="meta">
            <div class="stats progress-top">
              <span class="stat-value">${displayPage} / ${pageCount}</span>
            </div>
            <div class="topline">
              <span class="chapter-no">第 ${chapter.number} 話</span>
              ${isNew ? '<span class="badge-new">NEW</span>' : ''}
            </div>
            <h3 class="title">${chapter.title || ''}</h3>
          </div>
          <div class="actions">
            <a class="btn btn-main" href="reader.html?chapter=${index}&page=${displayPage}">${currentPage > 0 ? '繼續閱讀' : '閱讀'}</a>
            <a class="btn btn-sub" href="reader.html?chapter=${index}&page=1">從第一頁</a>
          </div>
        `;
        chapterList.appendChild(card);
      });
    }

    window.addEventListener('load', loadLatestComicData);
  </script>
</body>
</html>
